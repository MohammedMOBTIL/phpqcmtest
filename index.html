let test=[], answers=[], feedback=[], index=0, deadline=null, timerId=null, feedbackTimer=null, submitted=false;
const $=id=>document.getElementById(id);
const HISTORY_KEY="phpQuizAttemptHistory";
const THEME_KEY="phpQuizTheme";

function applyTheme(theme){
 document.documentElement.setAttribute("data-theme",theme);
 $("themeToggle").textContent=theme==="dark"?"Light theme":"Dark theme";
 localStorage.setItem(THEME_KEY,theme);
}
$("themeToggle").addEventListener("click",()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"));
applyTheme(localStorage.getItem(THEME_KEY)==="dark"?"dark":"light");

function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function letter(n){return String.fromCharCode(65+n)}
function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]")}catch(e){return []}}
function renderHistory(){
 const history=getHistory();
 if(!history.length){$("historyList").innerHTML="<p>No completed tests yet.</p>";$("clearHistory").disabled=true;return}
 $("clearHistory").disabled=false;
 let html="<table class='history-table'><thead><tr><th>Date</th><th>Questions</th><th>Score</th><th>Grade</th></tr></thead><tbody>";
 history.forEach(h=>{html+=`<tr><td>${textSafe(h.date)}</td><td>${h.total}</td><td><strong>${h.percent.toFixed(1)}%</strong> (${h.correct}/${h.total})</td><td>${textSafe(h.grade)}</td></tr>`});
 html+="</tbody></table>";
 $("historyList").innerHTML=html;
}
function start(){
 submitted=false;
 const count=Number($("length").value);
 test=shuffled(bank).slice(0,count).map(q=>{
  const pairs=q.options.map((text,i)=>({text,correct:i===q.answer.charCodeAt(0)-65}));
  return {...q,options:shuffled(pairs)};
 });
 answers=new Array(test.length).fill(null); feedback=new Array(test.length).fill(null); index=0;
 const minutes=Number($("minutes").value);
 deadline=minutes?Date.now()+minutes*60000:null;
 $("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
 $("history").classList.add("hidden");
 startTimer();render();
}
function startTimer(){
 clearInterval(timerId);
 if(!deadline){$("timer").textContent="No time limit";return}
 timerId=setInterval(()=>{
  const left=Math.max(0,deadline-Date.now());
  const s=Math.floor(left/1000),m=Math.floor(s/60);
  $("timer").textContent=`Time: ${m}:${String(s%60).padStart(2,"0")}`;
  if(left<=0){clearInterval(timerId);submit()}
 },250);
}
function render(){
 const q=test[index];
 $("counter").textContent=`Question ${index+1} / ${test.length}`;
 $("progress").style.width=`${((index+1)/test.length)*100}%`;
 $("topic").textContent=q.topic;
 $("question").textContent=q.question;
 $("options").innerHTML="";
 const state=feedback[index];
 q.options.forEach((opt,i)=>{
  let className="option"+(answers[index]===i?" selected":"");
  if(state){
   if(opt.correct) className+=" correct";
   else if(answers[index]===i) className+=" wrong";
   className+=" disabled";
  }
  const label=document.createElement("label");label.className=className;
  const radio=document.createElement("input");radio.type="radio";radio.name="answer";radio.checked=answers[index]===i;
  radio.disabled=!!state;
  radio.addEventListener("change",()=>answerQuestion(i));
  label.append(radio,document.createTextNode(letter(i)+". "+opt.text));$("options").append(label);
 });
 let feedbackBox=$("feedback");
 if(!feedbackBox){feedbackBox=document.createElement("div");feedbackBox.id="feedback";$("options").after(feedbackBox)}
 feedbackBox.innerHTML="";
 feedbackBox.className="feedback"+(state?" "+state.kind:"");
 if(state){
  if(state.kind==="correct"){
   feedbackBox.innerHTML=`<strong>Correct!</strong> ${state.remaining ? `Moving to the next question in ${state.remaining} seconds...` : "Correct answer."}`;
  }else{
   const correctIndex=q.options.findIndex(o=>o.correct);
   feedbackBox.innerHTML=`<strong>That answer is wrong.</strong><br><strong>Why:</strong> “${textSafe(q.options[answers[index]].text)}” does not answer the fact correctly.<br><strong>Right answer:</strong> ${letter(correctIndex)}. ${textSafe(q.options[correctIndex].text)}<br>Remember: ${textSafe(q.question.replace(/^(Which statement is correct\?|Choose the correct answer:|In PHP, what is the correct choice\?|Which option best completes the statement\?|Select the accurate proposition:|What should you select\?|Which answer matches the lecture\?|Identify the correct item:) /,""))}. The correct choice is “${textSafe(q.options[correctIndex].text)}”. <span class="source">Source: PDF ${textSafe(q.source)}</span>`;
  }
 }
 $("prev").disabled=index===0;
 $("prev").disabled=$("prev").disabled || !!state;
 $("next").disabled=!state;
 $("next").textContent=index===test.length-1?"Finish":"Next";
}
function answerQuestion(choice){
 if(feedback[index])return;
 answers[index]=choice;
 const q=test[index], correct=q.options[choice].correct;
 feedback[index]={kind:correct?"correct":"wrong",remaining:null};
 if(correct){
  feedback[index].remaining=3;
  clearInterval(feedbackTimer);
  render();
  feedbackTimer=setInterval(()=>{
   if(feedback[index]?.kind!=="correct"){clearInterval(feedbackTimer);return}
   feedback[index].remaining--;
   if(feedback[index].remaining<=0){clearInterval(feedbackTimer);goNext()}
   else render();
  },1000);
 }else render();
}
function goNext(){
 clearInterval(feedbackTimer);
 if(index<test.length-1){index++;render()}else submit();
}
$("prev").addEventListener("click",()=>{if(index>0&&!feedback[index]){index--;render()}});
$("next").addEventListener("click",goNext);
$("start").addEventListener("click",start);
$("retry").addEventListener("click",()=>{$("result").classList.add("hidden");$("setup").classList.remove("hidden");$("history").classList.remove("hidden");renderHistory()});
$("submit").addEventListener("click",submit);
$("clearHistory").addEventListener("click",()=>{if(confirm("Clear all saved quiz scores?")){localStorage.removeItem(HISTORY_KEY);renderHistory()}});
renderHistory();

function submit(){
 if(submitted)return;
 submitted=true;
 clearInterval(timerId);
 let correct=0, unanswered=0;const topics={};
 test.forEach((q,i)=>{
  const picked=answers[i];
  const ok=picked!==null&&q.options[picked].correct;
  if(picked===null)unanswered++;
  if(ok)correct++;
  if(!topics[q.topic])topics[q.topic]={correct:0,total:0};
  topics[q.topic].total++;if(ok)topics[q.topic].correct++;
 });
 const percent=correct/test.length*100;
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
 $("history").classList.remove("hidden");
 $("score").textContent=`${percent.toFixed(1)}%`;
 $("score").className="score "+(percent>=60?"good":"bad");
 const grade=percent>=90?"Excellent":percent>=75?"Very good":percent>=60?"Good":percent>=50?"Pass - needs review":"Needs significant review";
 $("grade").textContent=grade;
 $("summary").textContent=`${correct} correct, ${test.length-correct-unanswered} incorrect, ${unanswered} unanswered out of ${test.length}.`;
 const history=getHistory();
 history.unshift({date:new Date().toLocaleString(),total:test.length,correct,percent,grade});
 localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(0,100)));
 renderHistory();
 $("topicResults").innerHTML="";
 Object.keys(topics).sort().forEach(topic=>{
  const t=topics[topic],p=t.correct/t.total*100,row=document.createElement("div");row.className="topic-row";
  row.innerHTML=`<strong>${topic}</strong><div class="bar"><div style="width:${p}%"></div></div><span>${t.correct}/${t.total}</span>`;$("topicResults").append(row);
 });
 $("review").innerHTML="<h2>Answer review</h2>";
 test.forEach((q,i)=>{
  const picked=answers[i],ok=picked!==null&&q.options[picked].correct,correctIndex=q.options.findIndex(o=>o.correct);
  const div=document.createElement("article");div.className="card review-item "+(ok?"correct":"wrong");
  const chosen=picked===null?"No answer":letter(picked)+". "+q.options[picked].text;
  div.innerHTML=`<strong>${i+1}. ${topicSafe(q.topic)} — ${textSafe(q.question)}</strong><div class="answer">Your answer: ${textSafe(chosen)}</div><div class="answer">Correct answer: ${letter(correctIndex)}. ${textSafe(q.options[correctIndex].text)}</div><div class="source">Source: PDF ${textSafe(q.source)}</div>`;$("review").append(div);
 });
 window.scrollTo(0,0);
}
function textSafe(s){const d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
function topicSafe(s){return textSafe(s)}
</script>
</body>
</html>
